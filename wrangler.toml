# Cloudflare Pages 配置（替代本地 Express 单端口部署）
# 部署：前端静态 (client/dist) + Pages Functions (functions/) + D1 + R2
name = "ai-cc-prod"
compatibility_date = "2025-08-01"
pages_build_output_dir = "client/dist"

# D1 数据库（替代本地 better-sqlite3）
# 首次部署前执行：wrangler d1 create ai-cc-prod-db
# 然后把下面 database_id 替换成命令返回的 id
[[d1_databases]]
binding = "DB"
database_name = "ai-cc-prod-db"
database_id = "e37caa71-6bcd-41ff-b57b-0a2328da2f1b"
migrations_dir = "migrations"

# R2 对象存储（游客照片 / 打印图）
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "ai-cc-prod-images-5f5df686"

# 注：原 Durable Object（店员端 WebSocket 站内实时响铃）因部署令牌无 Worker 编辑权限，
# 暂未上线。站内实时响铃改为由 Web Push 层驱动（Service Worker postMessage 唤醒页面）。
# DO 绑定与 worker/ 目录保留，待令牌具备 Worker 权限后再启用。
